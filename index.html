<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- The page may load code only from this site, and may call only the services it names.
       A new outside service needs its host added here. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://services.arcgis.com https://geocode.gis.lacounty.gov https://photon.komoot.io https://valhalla1.openstreetmap.de https://routing.openstreetmap.de https://tiles.openfreemap.org; base-uri 'none'; object-src 'none'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LA Speed Cams: Los Angeles speed cameras near you</title>
  <meta name="description" content="See every Los Angeles speed camera on a map. Enter an address to count the cameras near it, or map a drive to see the cameras on the way. Live LADOT data.">
  <link rel="canonical" href="https://laspeedcams.com/">
  <meta name="theme-color" content="#00664f">
  <meta name="color-scheme" content="light">
  <meta name="format-detection" content="telephone=no">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="LA Speed Cams">
  <meta property="og:url" content="https://laspeedcams.com/">
  <meta property="og:title" content="LA Speed Cams: every Los Angeles speed camera on one map">
  <meta property="og:description" content="Enter an address to count the speed cameras near it, or map a drive to see the cameras on the way.">
  <meta property="og:image" content="https://laspeedcams.com/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A map of Los Angeles with its speed cameras, and a panel counting the cameras near an address.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="LA Speed Cams: every Los Angeles speed camera on one map">
  <meta name="twitter:description" content="Enter an address to count the speed cameras near it, or map a drive to see the cameras on the way.">
  <meta name="twitter:image" content="https://laspeedcams.com/og.jpg">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <!-- The first screen needs the font and the code. Start them all now, not one after another.
       The camera data is not preloaded: Safari does not match a fetch preload to the page's fetch(),
       and would download it twice. app.js asks for it first thing. -->
  <link rel="preload" href="fonts/overpass-latin-v19.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="modulepreload" href="app.js">
  <link rel="modulepreload" href="lib.js">
  <!-- Low priority: the camera data and the font come first, so the panel can paint while this loads. -->
  <link rel="modulepreload" href="vendor/maplibre-gl.mjs" fetchpriority="low">
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
  <link rel="preconnect" href="https://services.arcgis.com" crossorigin>
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"LA Speed Cams","url":"https://laspeedcams.com/","applicationCategory":"TravelApplication","operatingSystem":"Any","description":"A map of the Los Angeles speed cameras. Count the cameras near an address, or on a drive.","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dock" id="dock">
    <form class="search" id="search" role="search" autocomplete="off">
      <div class="search__row" id="near">
        <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
        <label class="sr" for="q">Address</label>
        <input id="q" name="q" type="text" placeholder="Enter an address" enterkeyhint="search"
               autocapitalize="words" autocorrect="off" spellcheck="false"
               role="combobox" aria-expanded="false" aria-controls="suggest" aria-autocomplete="list">
        <button type="button" class="search__btn" id="clear" aria-label="Clear the address" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
        <button type="button" class="search__btn" id="locate" aria-label="Use my location">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.6" class="fill"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
        </button>
        <button type="button" class="search__btn" id="open-trip" aria-label="Map a drive">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21v-8a4 4 0 0 1 4-4h9"/><path d="m15 4.5 4.5 4.5-4.5 4.5"/></svg>
        </button>
      </div>
      <div class="search__trip" id="trip" hidden>
        <div class="search__row">
          <span class="search__end" aria-hidden="true">A</span>
          <label class="sr" for="from">Start of the drive</label>
          <input id="from" name="from" type="text" placeholder="Start" enterkeyhint="search"
                 autocapitalize="words" autocorrect="off" spellcheck="false"
                 role="combobox" aria-expanded="false" aria-controls="suggest" aria-autocomplete="list">
          <button type="button" class="search__btn search__clear" id="clear-from" aria-label="Clear the start" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" class="tint"/><path d="m9.2 9.2 5.6 5.6M14.8 9.2l-5.6 5.6"/></svg>
          </button>
          <button type="button" class="search__btn" id="locate-from" aria-label="Start at my location">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.6" class="fill"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
          </button>
          <button type="button" class="search__btn search__close" id="close-trip" aria-label="Close the drive">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="search__row">
          <span class="search__end" aria-hidden="true">B</span>
          <label class="sr" for="to">End of the drive</label>
          <input id="to" name="to" type="text" placeholder="End" enterkeyhint="search"
                 autocapitalize="words" autocorrect="off" spellcheck="false"
                 role="combobox" aria-expanded="false" aria-controls="suggest" aria-autocomplete="list">
          <button type="button" class="search__btn search__clear" id="clear-to" aria-label="Clear the end" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" class="tint"/><path d="m9.2 9.2 5.6 5.6M14.8 9.2l-5.6 5.6"/></svg>
          </button>
          <button type="button" class="search__btn" id="swap" aria-label="Swap the start and the end">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 20V5M4 9l4-4 4 4M16 4v15M12 15l4 4 4-4"/></svg>
          </button>
        </div>
      </div>
      <ul class="suggest" id="suggest" role="listbox" aria-label="Matching addresses" hidden></ul>
    </form>

    <p class="sr" id="status" role="status"></p>

    <section class="panel" id="panel" aria-label="Cameras">
      <button type="button" class="panel__grip" id="grip" aria-label="Panel size: small. Press to change the size."><span></span></button>
      <div class="panel__body" id="body">
        <div id="view" aria-busy="true">
          <!-- What shows until app.js takes over: the heading, and a quiet placeholder for the counts. -->
          <h1>Speed cameras in Los Angeles</h1>
          <p class="lede">Loading the cameras…</p>
          <div class="skeleton" aria-hidden="true"><span></span><span></span><span></span></div>
        </div>
        <div class="foot" id="foot"></div>
      </div>
    </section>
  </div>

  <div id="map" role="region" aria-label="Map of Los Angeles speed cameras"></div>

  <noscript><p class="noscript">This map needs JavaScript.</p></noscript>
  <script type="module" src="app.js"></script>
  <!-- Vercel Web Analytics and Speed Insights. Same-origin scripts, so the policy above
       (script-src 'self', connect-src 'self') already allows them. The docs' inline
       window.va / window.si queue stubs are left out: the policy blocks inline scripts,
       and nothing here calls va() or si() before the scripts load. -->
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
