# Runs the four test suites on each push. `npm test` runs the same suites on a laptop.
# Each action is pinned to the commit of a release, so a moved tag cannot change what runs.
name: tests

on: push

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: lint, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x
      # These suites use no packages, so the job skips the install.
      - run: npm run test:lint
      - run: npm run test:unit
      - run: npm run test:py

  browser:
    name: browser
    # Playwright 1.60 cannot install its browsers on Ubuntu 26.04, which ubuntu-latest now is.
    # Move this back to ubuntu-latest together with a Playwright version that supports it.
    runs-on: ubuntu-24.04
    # A run takes 13 to 19 minutes. The limit leaves room for a slow run.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
