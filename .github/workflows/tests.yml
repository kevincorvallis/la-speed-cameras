# Runs the four test suites on each push. `npm test` runs the same suites on a laptop.
name: tests

on: push

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: lint, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      # These suites use no packages, so the job skips the install.
      - run: npm run test:lint
      - run: npm run test:unit
      - run: npm run test:py

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
